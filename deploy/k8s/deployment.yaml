apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-mapping-service
  labels:
    app: compliance-mapping-service
    jira-story: AIF-82
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliance-mapping-service
  template:
    metadata:
      labels:
        app: compliance-mapping-service
    spec:
      containers:
        - name: compliance-mapping-service
          image: compliance-mapping-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: compliance-mapping-service-config
            - secretRef:
                name: compliance-mapping-service-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
